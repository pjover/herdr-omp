name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint
        run: |
          sh -n bin/herdr-omp
          shellcheck bin/herdr-omp examples/shell-functions.sh

      - name: --help works without herdr or omp installed
        run: ./bin/herdr-omp --help
